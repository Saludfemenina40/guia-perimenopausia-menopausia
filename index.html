<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Salud 40+</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#7A5C7E; --teal-soft:#EFE6F0; --pink:#B5657A; --pink-soft:#F6E3E8;
  --ink:#2E2430; --muted:#6E6370; --bg:#FAF7F9; --card:#ffffff; --line:#EBE3EA;
  --ok:#2e9e6b; --ok-soft:#e5f5ec; --vig:#c98a00; --vig-soft:#fff4d9; --alto:#d33a3a; --alto-soft:#fde7e7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 16px 0;position:sticky;top:0;z-index:5}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0;font-weight:700}
h1 span{color:var(--pink)}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--teal);border-color:var(--teal);color:#fff}
main{padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.cta{display:block;text-align:left;border:none;border-radius:16px;padding:20px;cursor:pointer;font:inherit;color:#fff;width:100%}
.cta b{display:block;font-size:18px;margin-bottom:4px}
.cta.t{background:var(--teal)} .cta.p{background:#E9C3CC;color:#5A2E3A}
label{display:block;font-size:13px;font-weight:500;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:60px}
.field small{color:var(--muted);font-size:12px}
.btn{border:none;background:var(--teal);color:#fff;font:inherit;font-weight:600;padding:10px 18px;border-radius:999px;cursor:pointer}
.btn.sec{background:var(--teal-soft);color:var(--teal)}
.btn.pk{background:var(--pink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.del{background:transparent;color:var(--alto);padding:4px 8px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sym{padding:10px 0;border-top:1px solid var(--line)}
.sym:first-of-type{border-top:none}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.scale button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
.scale button.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-weight:600}
.scale button.on.l3{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.ok{background:var(--ok-soft);color:var(--ok)} .vig{background:var(--vig-soft);color:var(--vig)} .alto{background:var(--alto-soft);color:var(--alto)} .na{background:#F1EBF0;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.alert.alto{background:var(--alto-soft);color:#8a1f1f;font-weight:400}
.alert.vig{background:var(--vig-soft);color:#6e4c00;font-weight:400}
.alert.info{background:var(--teal-soft);color:#55385A}
.rec{border-left:4px solid var(--teal);padding:8px 12px;margin-bottom:10px;background:#FBF8FB;border-radius:0 10px 10px 0}
.rec b{display:block}
.rec .why{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:#F1EBF0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.barrow{display:grid;grid-template-columns:160px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.big{font-size:34px;font-weight:700;line-height:1}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--muted)}
.dot.done{background:var(--pink);border-color:var(--pink);color:#fff}
.dot.fut{opacity:.35;cursor:default}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.wk i{display:block;background:var(--teal);border-radius:6px 6px 0 0;margin:0 auto 4px;width:70%}
svg text{font-family:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.reto{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;background:#fff}
.rt{font-size:16px}
.stats{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
.stats small{display:block;font-size:12px;color:var(--muted)}
.big2{font-size:26px;font-weight:700;color:var(--teal);line-height:1.1}
.hitos{display:flex;gap:8px;margin-left:auto}
.hito{display:flex;flex-direction:column;align-items:center;font-size:22px;opacity:.25;filter:grayscale(1)}
.hito.on{opacity:1;filter:none}
.hito small{font-size:10px;color:var(--muted)}
.msg{margin:4px 0 12px;font-size:14px}
.big-check{width:100%;padding:15px;font-size:16px}
.big-check.done,.btn.hecho{background:var(--pink)}
.big-check small{font-weight:400;font-size:12px;opacity:.9}
.tip{background:var(--pink-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0 4px}
details{margin-top:10px} summary{cursor:pointer}
.dot.today{border:2px solid var(--teal)}
.pill.tag{background:var(--pink-soft);color:#8A3A52}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.logro{background:var(--pink-soft);border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;min-width:130px}
.logro b{display:block;font-size:13px} .logro small{color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(46,36,48,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov>div{background:#fff;border-radius:18px;padding:28px 24px;max-width:360px;text-align:center}
.ov .e{font-size:56px;line-height:1.2}
h3{font-size:15px}
.obj{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cd{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:54px;padding:5px 2px;font:inherit;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.cd.hoy{border:2px solid var(--teal);font-weight:700}.cd.sel{background:var(--teal-soft)}.cd.fut{opacity:.5}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.cdots i{width:7px;height:7px;border-radius:50%;display:block}
.ley{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:12px}.ley i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.ev{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.evd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.tcomp th,.tcomp td{white-space:nowrap}.tcomp a{color:var(--teal)}
.vv{padding:2px 8px;border-radius:99px;font-weight:600;font-size:13px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}
@media (max-width:520px){.barrow{grid-template-columns:110px 1fr 40px}.cta b{font-size:16px}}
@media print{header nav,.noprint,.btn{display:none!important}header{position:static}.card{break-inside:avoid}}
</style>
</head>

const RETOS=[
 {id:'prot',ic:'🍳',t:'Desayuno con proteína',tipo:'diario',para:['energia','cog','musc','cardio'],d:'Un desayuno con proteína estabiliza la glucosa toda la mañana: menos bajones, menos antojos y más saciedad.',tips:['Tortilla de 2 huevos con espinacas y unas láminas de aguacate.','Yogur griego natural con frutos rojos, nueces y canela.','Revuelto de tofu con champiñones y cúrcuma.','Kéfir con semillas de chía remojadas y un puñado de arándanos.','Hummus con crudités y un huevo duro.','Sobras de la cena: un poco de pescado o legumbre también es un desayuno.','Queso fresco batido con fruta y semillas de calabaza.']},

/* ===================== UTILIDADES ===================== */
let D;
const vacio=()=>({perfil:{},sintomas:[],analiticas:[],medidas:[],digestivo:[],ejercicio:[],retos:{},objetivos:[],logros:[]});
function cargar(){try{D=Object.assign(vacio(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){D=vacio()}D.objetivos=(D.objetivos||[]).map(o=>Object.assign({tipo:'meta',dias:[]},o))}
function guardar(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('No se ha podido guardar. Exporta tus datos para no perderlos.')}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>ymd(new Date());
const fmt=s=>{if(!s)return'';const[a,m,d]=s.split('-');return d+'/'+m+'/'+a.slice(2)};
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byFecha=a=>[...a].sort((x,y)=>x.fecha<y.fecha?1:-1);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dt=s=>{const[a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const sumaDias=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)};
const diasEntre=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
const pill=e=>`<span class="pill ${e}">${{ok:'Óptimo',vig:'Vigilar',alto:'Fuera de rango',na:'Sin dato'}[e]}</span>`;
const colorE=e=>({ok:'var(--ok)',vig:'var(--vig)',alto:'var(--alto)'}[e]||'var(--teal)');
const fmtN=v=>String(v).replace('.',',');

function chart(pts,color='#7A5C7E',unidad='',cf=null){
  pts=pts.filter(p=>p.y!=null).sort((a,b)=>a.x<b.x?-1:1);
  if(pts.length<2)return '<p class="muted">Con 2 registros o más verás aquí la evolución.</p>';
  const W=400,H=190,P=30;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1}const pd=(mx-mn)*.2;mn-=pd;mx+=pd;
  const X=i=>P+i*(W-2*P)/(pts.length-1),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);
  const d=pts.map((q,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  const pc=pts.map((q,i)=>`<circle cx="${X(i)}" cy="${Y(q.y)}" r="5" fill="${cf?cf(q.y):color}"/><text x="${X(i)}" y="${Y(q.y)-9}" font-size="14" font-weight="600" text-anchor="middle" fill="#2E2430">${fmtN(r1(q.y))}</text>`).join('');
  const step=Math.ceil(pts.length/4);
  const lx=pts.map((q,i)=>i%step===0||i===pts.length-1?`<text x="${X(i)}" y="${H-10}" font-size="12" text-anchor="middle" fill="#6E6370">${fmt(q.x)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución ${esc(unidad)}"><line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="#EBE3EA"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pc}${lx}</svg>`;
}

/* ===================== CÁLCULOS ===================== */
function calcAnal(a){
  const o={...a};
  if(a.glucosa!=null&&a.insulina!=null)o.homa=r2(a.glucosa*a.insulina/405);
  if(a.tg!=null&&a.hdl)o.tghdl=r2(a.tg/a.hdl);
  if(a.ct!=null&&a.hdl!=null)o.nohdl=Math.round(a.ct-a.hdl);
  return o;
}
function calcMed(m){
  const o={...m};const alt=num(D.perfil.altura);
  if(m.peso!=null&&alt)o.imc=r1(m.peso/((alt/100)**2));
  if(m.cintura!=null&&alt)o.ica=r2(m.cintura/alt);
  if(m.cintura!=null&&m.cadera)o.icc=r2(m.cintura/m.cadera);
  return o;
}
function ultimo(arr,k,calc){for(const e of byFecha(arr)){const c=calc?calc(e):e;if(c[k]!=null)return{v:c[k],fecha:e.fecha}}return null}
function evalTA(s,d){if(s>=140||d>=90)return'alto';if(s<120&&d<80)return'ok';return'vig'}

function valoracionCardio(){
  const items=[];
  for(const k in MARC){const u=ultimo(D.analiticas,k,calcAnal);if(u)items.push({k,n:MARC[k].n,v:u.v,u:MARC[k].u,r:MARC[k].r,e:MARC[k].f(u.v),fecha:u.fecha})}
  for(const k of ['imc','cintura','ica','icc']){const u=ultimo(D.medidas,k,calcMed);if(u)items.push({k,n:MARC_MED[k].n,v:u.v,u:MARC_MED[k].u,r:MARC_MED[k].r,e:MARC_MED[k].f(u.v),fecha:u.fecha})}
  const ta=byFecha(D.medidas).find(m=>m.tas!=null&&m.tad!=null);
  if(ta)items.push({k:'ta',n:'Tensión arterial',v:ta.tas+'/'+ta.tad,u:'mmHg',r:'< 120/80',e:evalTA(ta.tas,ta.tad),fecha:ta.fecha,tas:ta.tas,tad:ta.tad});
  const get=k=>items.find(i=>i.k===k);
  // Síndrome metabólico (criterios ATP III, mujer)
  const crit=[];let evaluados=0;
  const c=get('cintura');if(c){evaluados++;if(c.v>=88)crit.push('cintura ≥ 88 cm')}
  const tg=get('tg');if(tg){evaluados++;if(tg.v>=150)crit.push('triglicéridos ≥ 150')}
  const h=get('hdl');if(h){evaluados++;if(h.v<50)crit.push('HDL < 50')}
  const t=get('ta');if(t){evaluados++;if(t.tas>=130||t.tad>=85)crit.push('tensión ≥ 130/85')}
  const g=get('glucosa');if(g){evaluados++;if(g.v>=100)crit.push('glucosa ≥ 100')}
  const pts=items.reduce((s,i)=>s+(i.e==='ok'?1:i.e==='vig'?.5:0),0);
  const score=items.length?Math.round(pts/items.length*100):null;
  return{items,get,score,sm:{crit,evaluados}};
}

function scoreSint(e){
  const out={};let tot=0,n=0;
  for(const c of CATS){let s=0,k=0;for(const[id]of c.items){if(e.v[id]!=null){s+=e.v[id];k++}}if(k){out[c.id]=Math.round(s/(3*k)*100);tot+=s;n+=k}}
  out.total=n?Math.round(tot/(3*n)*100):null;return out;
}

function fase(){
  const p=D.perfil;if(!p.ultimaRegla)return null;
  const meses=diasEntre(p.ultimaRegla,hoy())/30.4;
  if(meses>=12)return{t:'Posmenopausia',d:'Han pasado 12 meses o más desde tu última regla.'};
  if(p.irregular||meses>=2)return{t:'Perimenopausia (probable)',d:'Ciclos irregulares o más de 60 días sin regla. Se confirma la menopausia tras 12 meses sin regla.'};
  return{t:'Ciclos presentes',d:'Si tienes síntomas y más de 40 años, puede ser una perimenopausia temprana.'};
}

function semanaActual(){
  const d=new Date();const dia=(d.getDay()+6)%7;d.setDate(d.getDate()-dia);return ymd(d);
}
function resumenSemana(inicio){
  const fin=dt(inicio);fin.setDate(fin.getDate()+7);const f=ymd(fin);
  const reg=D.ejercicio.filter(e=>e.fecha>=inicio&&e.fecha<f);
  const min=reg.filter(e=>e.int!=='suave').reduce((s,e)=>s+(+e.min||0),0);
  const fuerza=new Set(reg.filter(e=>e.tipo==='Fuerza').map(e=>e.fecha)).size;
  const total=reg.reduce((s,e)=>s+(+e.min||0),0);
  return{min,fuerza,total};
}

/* ===================== AVISOS Y RECOMENDACIONES ===================== */
function avisos(){
  const A=[];const V=valoracionCardio();const ls=byFecha(D.sintomas)[0];
  if(ls){
    if(ls.sangrado==='post')A.push(['alto','Has registrado un sangrado tras 12 meses sin regla. Pide cita con tu ginecóloga lo antes posible: siempre hay que valorarlo.']);
    if(ls.sangrado==='abund')A.push(['vig','Sangrados muy abundantes o entre reglas: coméntalo con tu ginecóloga y revisa tu ferritina.']);
    if(ls.v.tristeza===3||ls.v.apatia===3)A.push(['vig','Has marcado tristeza o falta de ilusión intensas. Si dura más de dos semanas, pide ayuda a tu médica o a un profesional de salud mental. No tienes que pasarlo sola.']);
    if(ls.v.palpit===3)A.push(['vig','Palpitaciones intensas: coméntalo con tu médica, sobre todo si van con mareo, falta de aire o dolor en el pecho (en ese caso, urgencias).']);
  }
  const t=V.get('ta');
  if(t){if(t.tas>=180||t.tad>=120)A.push(['alto','Tensión muy alta ('+t.v+'). Repite la medida en reposo; si se mantiene o tienes dolor de cabeza intenso, dolor en el pecho o alteraciones de la visión, acude a urgencias.']);
    else if(t.e==='alto')A.push(['alto','Tensión arterial ≥ 140/90. Consulta con tu médica para confirmarlo con varias medidas.'])}
  const g=V.get('glucosa'),h=V.get('hba1c');
  if((g&&g.v>=126)||(h&&h.v>=6.5))A.push(['alto','Glucosa o HbA1c en rango compatible con diabetes. Necesita confirmarse con tu médica.']);
  else if((g&&g.v>=100)||(h&&h.v>=5.7))A.push(['vig','Glucosa o HbA1c en rango de prediabetes: es el mejor momento para actuar, es reversible.']);
  if(V.sm.crit.length>=3)A.push(['alto','Cumples '+V.sm.crit.length+' de 5 criterios de síndrome metabólico ('+V.sm.crit.join(', ')+'). Conviene un plan de acompañamiento y revisión médica.']);
  const vd=V.get('vitd');if(vd&&vd.v<20)A.push(['vig','Vitamina D en déficit ('+fmtN(vd.v)+' ng/mL). La suplementación debe pautarla un profesional.']);
  if(vd&&vd.v>100)A.push(['vig','Vitamina D por encima de 100 ng/mL: revisa la dosis de suplemento con tu profesional.']);
  const fe=V.get('ferritina');if(fe&&fe.v<15)A.push(['vig','Ferritina muy baja ('+fmtN(fe.v)+'): puede explicar cansancio y caída de cabello. Coméntalo con tu médica.']);
  const ts=V.get('tsh');if(ts&&ts.e!=='ok')A.push(['vig','TSH fuera de rango: la tiroides puede dar síntomas parecidos a la perimenopausia. Revísalo con tu médica.']);
  const lim=new Date();lim.setDate(lim.getDate()-21);const l=ymd(lim);
  const dig=D.digestivo.filter(d=>d.fecha>=l);
  if(dig.some(d=>d.sangre))A.push(['alto','Has registrado sangre en las heces. Consulta con tu médica.']);
  if(dig.filter(d=>d.hinchazon>=2).length>=10)A.push(['vig','Hinchazón casi diaria durante 3 semanas o más. Si es nueva para ti (sobre todo a partir de los 50), consulta con tu médica para descartar otras causas.']);
  return A;
}

function recomendaciones(){
  const R=[];const add=(t,d,why)=>R.push({t,d,why});
  const V=valoracionCardio();const ls=byFecha(D.sintomas)[0];const S=ls?scoreSint(ls):{};
  const alto=id=>S[id]!=null&&S[id]>=50;
  const ins=V.get('homa')||V.get('insulina');
  if(ins&&ins.e!=='ok')add('Prioriza la estabilidad de tu glucosa','Empieza las comidas por la verdura, después la proteína y al final los hidratos. Reduce azúcares y harinas refinadas y camina 10 minutos después de comer.','Tu '+ins.n.toLowerCase()+' está en '+fmtN(ins.v)+'.');
  const tgh=V.get('tghdl');if(tgh&&tgh.e!=='ok')add('Baja tu ratio triglicéridos/HDL','Reduce alcohol, zumos, bollería y azúcares añadidos. Suma pescado azul 2–3 veces por semana y fuerza.','Ratio TG/HDL de '+fmtN(tgh.v)+' (un valor alto se asocia a resistencia a la insulina).');
  const ldl=V.get('ldl')||V.get('nohdl');if(ldl&&ldl.e!=='ok')add('Más fibra soluble y grasas de calidad','Avena, legumbres, semillas de lino, fruta entera, aceite de oliva virgen extra y frutos secos a diario.',ldl.n+': '+fmtN(ldl.v)+' mg/dL.');
  const c=V.get('cintura')||V.get('ica');if(c&&c.e!=='ok')add('Trabaja la grasa abdominal desde el músculo','Fuerza 2–3 veces por semana, proteína en cada comida y sueño suficiente. La báscula no lo cuenta todo: sigue tu cintura.',c.n+': '+fmtN(c.v)+(c.u?' '+c.u:'')+'.');
  const vd=V.get('vitd');if(vd&&vd.v<30)add('Cuida tu vitamina D','Exposición solar prudente, pescado azul y huevos. Valora con tu profesional la suplementación.','Vitamina D de '+fmtN(vd.v)+' ng/mL.');
  if(alto('vaso'))add('Identifica tus desencadenantes de sofocos','Anota si aparecen tras alcohol, café, picante, cenas copiosas o estrés. Cena pronto y ligera y ten a mano capas de ropa.','Tus síntomas vasomotores están en un '+S.vaso+'%. La insulina elevada se ha asociado a más sofocos.');
  if(alto('sueno'))add('Ritual de sueño','Horario regular, cafeína solo antes de las 14 h, cena 2–3 h antes de dormir, habitación fresca y oscura, luz natural por la mañana.','Tus alteraciones del sueño están en un '+S.sueno+'%.');
  if(alto('animo'))add('Cuida tu sistema nervioso','Movimiento diario, contacto con la naturaleza, pausas de respiración lenta y espacios para ti. El ejercicio de fuerza también mejora el ánimo.','Tu salud emocional marca un '+S.animo+'%.');
  if(alto('cog'))add('Combustible estable para tu cerebro','Comidas con proteína y fibra, sin largos periodos de picoteo dulce. Dormir bien es la base de la memoria.','Concentración y memoria en un '+S.cog+'%.');
  if(alto('energia'))add('Recupera energía','Proteína en el desayuno, no saltarte comidas y revisar ferritina, vitamina D y TSH en tu próxima analítica.','Energía y metabolismo en un '+S.energia+'%.');
  if(alto('musc'))add('Muévete para tus articulaciones','Fuerza con cargas progresivas, movilidad diaria y pescado azul. Revisa tu vitamina D.','Articulaciones y músculo en un '+S.musc+'%.');
  if(alto('dig'))add('Calma tu digestión','Come sin prisa y mastica bien, aumenta la fibra de forma progresiva, hidrátate y registra qué alimentos te sientan mal.','Síntomas digestivos en un '+S.dig+'%.');
  if(alto('genito')||alto('libido'))add('Tu salud íntima también cuenta','Coméntalo con tu ginecóloga: existen tratamientos locales eficaces. Una fisioterapeuta de suelo pélvico también puede ayudarte.','Libido y genitourinario: '+(S.libido??'–')+'% / '+(S.genito??'–')+'%.');
  const sem=resumenSemana(semanaActual());
  if(sem.fuerza<2)add('Fuerza esta semana','Llevas '+sem.fuerza+' de 2 sesiones de fuerza. Con 20–30 minutos basta para empezar.','A partir de los 40 se pierde músculo más rápido.');
  const dig=byFecha(D.digestivo).slice(0,7);
  if(dig.length>=3&&dig.filter(d=>d.bristol&&d.bristol<=2).length>=dig.length/2)add('Ayuda a tu tránsito','Más verdura, legumbre, kiwi o ciruelas, semillas de lino o chía remojadas, agua y movimiento diario. Respeta el momento de ir al baño.','La mayoría de tus registros son Bristol 1–2.');
  if(!R.length)add('Empieza por lo básico','Proteína en el desayuno, 10 minutos de paseo tras la comida principal, fuerza dos veces por semana y una rutina de noche sin pantallas. Elige una o dos y mantenlas 15 días.','Con tus registros, las recomendaciones se irán personalizando.');
  return R;
}

    </div>
    <div class="card"><h2>Carga de síntomas</h2>

  return `<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="btn sec sm" onclick="calMes(-1)" aria-label="Mes anterior">‹</button><h2 style="margin:0">${cap(pr.toLocaleDateString('es-ES',{month:'long',year:'numeric'}))}</h2><button class="btn sec sm" onclick="calMes(1)" aria-label="Mes siguiente">›</button></div>

function top3(S){

}
function barrasCat(S,P){
  return CATS.filter(c=>S[c.id]!=null).map(c=>{const v=S[c.id];const col=v<34?'var(--ok)':v<60?'var(--vig)':'var(--alto)';

    return`<div class="barrow"><span>${c.nom}</span><div class="bar"><i style="width:${Math.max(v,2)}%;background:${col}"></i></div><b>${v}%${tr}</b></div>`}).join('')+(P?'<p class="muted">▲▼ Cambio respecto al registro anterior.</p>':'');

  <p class="muted">Objetivo semanal: 150 minutos de actividad moderada y 2 días de fuerza.</p>`;
}
function estadoReto(r){
  const a=D.retos[r.id];const sem=r.tipo==='semanal';const dur=sem?SEM_DIAS:DIAS_RETO;const meta=sem?META_SEM:META_DIARIO;
  const h=hoy();const fin=sumaDias(a.inicio,dur-1);
  const dias=a.dias.filter(f=>f>=a.inicio&&f<=fin);const hechos=dias.length;
  const terminado=h>fin;const diaN=Math.min(dur,diasEntre(a.inicio,h)+1);
  const hoyHecho=dias.includes(h);
  let racha=0;if(!sem){let f=hoyHecho?h:sumaDias(h,-1);while(dias.includes(f)){racha++;f=sumaDias(f,-1)}}
  const quedan=terminado?0:diasEntre(h,fin)+1;
  const semIdx=Math.min(3,Math.floor((diaN-1)/7));const iniSem=sumaDias(a.inicio,semIdx*7),finSem=sumaDias(a.inicio,semIdx*7+6);
  const semana=dias.filter(f=>f>=iniSem&&f<=finSem).length;
  const superado=hechos>=meta;const faltan=Math.max(0,meta-hechos);
  const ayer=sumaDias(h,-1);const falloAyer=!sem&&!hoyHecho&&ayer>=a.inicio&&!dias.includes(ayer)&&hechos>0;
  let msg;
  if(terminado)msg=superado?'🎉 ¡Reto superado! Has sumado '+hechos+' '+(sem?'sesiones':'días')+'. ¿Lo repites para consolidarlo?':'Has sumado '+hechos+' '+(sem?'sesiones':'días')+'. Cada uno cuenta: ¿lo intentamos de nuevo?';
  else if(superado)msg='🌸 ¡Reto superado! Lo que sumes a partir de ahora es extra.';
  else if(!sem&&faltan>quedan)msg='Este reto ya no llega a '+meta+', pero lo importante es el hábito. Sigue sumando días.';
  else if(falloAyer)msg='Ayer no lo marcaste. No pasa nada: la clave es no fallar dos días seguidos. Hoy es un buen día.';
  else if(sem)msg=semana>=2?'Semana cumplida 💪. Te faltan '+faltan+' sesiones para superar el reto.':'Esta semana llevas '+semana+' de 2 sesiones. Te faltan '+faltan+' para superar el reto.';
  else if(hoyHecho)msg=ANIMOS[hechos%ANIMOS.length]+' Te faltan '+faltan+' días para superar el reto.';
  else msg=hechos?'Llevas '+hechos+' días. Te faltan '+faltan+' para superar el reto.':'Primer paso: márcalo hoy en cuanto lo cumplas.';

   <h3>Añadir un objetivo</h3>
   <div class="grid g3">
     <div class="field" style="grid-column:1/-1"><label>¿Qué quieres conseguir?</label><input id="o_txt" placeholder="Ej.: Dormir 7 horas"></div>
     <div class="field"><label>Tipo</label><select id="o_tipo" onchange="tipoObj(this.value)"><option value="habito">Hábito semanal</option><option value="meta">Meta con fecha</option></select></div>
     <div class="field" id="o_hab"><label>¿Cuántos días por semana?</label><select id="o_veces">${[1,2,3,4,5,6,7].map(n=>`<option ${n===5?'selected':''}>${n}</option>`).join('')}</select></div>
     <div class="field" id="o_meta" style="display:none"><label>Fecha límite (opcional)</label><input type="date" id="o_lim" min="${h}"></div>
   </div>
   <p class="muted" style="margin:12px 0 6px">Ideas para empezar (tócalas para rellenar):</p>
   <div class="row" style="gap:6px">${IDEAS_OBJ.map((x,i)=>`<button class="chip" onclick="ideaObj(${i})">${x[0]}</button>`).join('')}</div>
   <div class="row" style="margin-top:14px"><button class="btn" onclick="addObj()">Añadir objetivo</button></div>
  </div>`;
}
function hoyHTML(){
  const h=hoy();const act=RETOS.filter(r=>D.retos[r.id]);const hb=D.objetivos.filter(o=>o.tipo==='habito');
  if(!act.length&&!hb.length)return`<p class="muted">No tienes retos ni objetivos activos. Empieza por uno de los retos recomendados para ti.</p><button class="btn pk sm" onclick="ir('retos')">Elegir un reto</button>`;
  return act.map(r=>{const e=estadoReto(r);return`<div class="mini"><div><b>${r.ic} ${r.t}</b><div class="muted">${r.tipo==='semanal'?e.hechos+' de '+e.meta+' sesiones · '+e.semana+' esta semana':'🔥 Racha de '+e.racha+' · '+e.hechos+' de '+e.meta+' días'}</div></div>${e.terminado?`<button class="btn sec sm" onclick="ir('retos')">Ver resultado</button>`:`<button class="btn sm ${e.hoyHecho?'hecho':''}" onclick="toggleDia('${r.id}','${h}')">${e.hoyHecho?'✓ Hecho':'Hoy lo he hecho'}</button>`}</div>`}).join('')
   +hb.map(o=>{const on=(o.dias||[]).includes(h);return`<div class="mini"><div><b>🔁 ${esc(o.t)}</b><div class="muted">${contarSemana(o,h)} de ${o.veces} días esta semana</div></div><button class="btn sm ${on?'hecho':''}" onclick="toggleHab('${o.id}','${h}')">${on?'✓ Hecho':'Hoy lo he hecho'}</button></div>`}).join('')
   +`<div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="ir('retos')">Retos y objetivos</button><button class="btn sec sm" onclick="ir('calendario')">Ver calendario</button></div>`;
}

/* ===================== CALENDARIO ===================== */
let CAL=null;
const CATCAL={reto:['Retos','#B5657A'],obj:['Objetivos','#7A5C7E'],sint:['Síntomas','#D9A7BE'],ej:['Ejercicio','#6B8F71'],dig:['Digestivo','#C9A35F'],med:['Medidas y analíticas','#5C6B8A']};
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function eventosPorDia(){
  const E={};const add=(f,c,t)=>{if(f)(E[f]=E[f]||[]).push({c,t})};
  for(const r of RETOS){const a=D.retos[r.id];if(a)a.dias.forEach(f=>add(f,'reto',r.ic+' Reto cumplido: '+r.t))}
  (D.logros||[]).forEach(l=>{const r=RETOS.find(x=>x.id===l.reto);if(r)add(l.fecha,'reto','🏅 Reto superado: '+r.t)});
  D.objetivos.forEach(o=>{(o.dias||[]).forEach(f=>add(f,'obj','🔁 '+esc(o.t)));if(o.hecho&&o.fechaHecho)add(o.fechaHecho,'obj','✅ Objetivo conseguido: '+esc(o.t));else if(!o.hecho&&o.limite)add(o.limite,'obj','⏳ Fecha límite: '+esc(o.t))});
  D.sintomas.forEach(e=>add(e.fecha,'sint','📝 Síntomas registrados · carga '+scoreSint(e).total+'%'));
  D.ejercicio.forEach(e=>add(e.fecha,'ej','🏃‍♀️ '+esc(e.tipo)+' · '+e.min+' min'));
  D.digestivo.forEach(d=>add(d.fecha,'dig','🌿 Digestivo'+(d.bristol?' · Bristol '+d.bristol:'')+' · hinchazón: '+NIV[d.hinchazon||0].toLowerCase()));
  D.medidas.forEach(m=>add(m.fecha,'med','⚖️ Medidas'+(m.peso!=null?' · '+fmtN(m.peso)+' kg':'')+(m.cintura!=null?' · cintura '+fmtN(m.cintura)+' cm':'')+(m.tas!=null?' · tensión '+m.tas+'/'+m.tad:'')));
  D.analiticas.forEach(a=>add(a.fecha,'med','🧪 Analítica guardada'));
  return E;
}
function calMes(n){CAL.m+=n;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}render()}
function calHoy(){CAL=null;render()}
function detalleDia(f,E){
  const h=hoy();const ev=E[f]||[];
  const tit=cap(dt(f).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
  let acc='';
  if(f<=h){
    const rs=RETOS.filter(r=>{const a=D.retos[r.id];return a&&f>=a.inicio&&f<=estadoReto(r).fin});
    const hb=D.objetivos.filter(o=>o.tipo==='habito'&&f>=(o.creado||''));
    if(rs.length||hb.length)acc=`<h3>Marca lo que cumpliste ${f===h?'hoy':'este día'}</h3><div class="row" style="gap:6px">${rs.map(r=>{const on=D.retos[r.id].dias.includes(f);return`<button class="chip ${on?'on':''}" onclick="toggleDia('${r.id}','${f}')">${on?'✓ ':''}${r.ic} ${r.t}</button>`}).join('')}${hb.map(o=>{const on=(o.dias||[]).includes(f);return`<button class="chip ${on?'on':''}" onclick="toggleHab('${o.id}','${f}')">${on?'✓ ':''}🔁 ${esc(o.t)}</button>`}).join('')}</div>`;
  }
  const lista=ev.length?ev.map(e=>`<div class="ev"><i class="evd" style="background:${CATCAL[e.c][1]}"></i>${e.t}</div>`).join(''):`<p class="muted">${f>h?'Este día aún no ha llegado.':'No hay nada registrado este día.'}</p>`;
  return`<div class="card"><h2>${tit}</h2>${lista}${acc}</div>`;
}

/* ===================== EXPORTAR / IMPORTAR ===================== */
let DL=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function exportar(){
  const nombre='mi-salud-40_'+hoy()+'.json';const txt=JSON.stringify(D,null,2);
  const marca=()=>{D.ultimaCopia=hoy();guardar();if(TAB==='inicio'||TAB==='datos')render()};
  if(DL){
    try{await DL.save({filename:nombre,data:txt});marca();toast('Copia de seguridad guardada')}
    catch(e){const c=e&&e.code;toast(c==='declined'?'Descarga cancelada':c==='rate_limited'?'Espera un momento y vuelve a intentarlo':'No se ha podido descargar en este navegador')}
    return;
  }
  if(window.claude&&window.claude.use)return toast('La descarga aún no está lista. Inténtalo de nuevo en unos segundos.');
  const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();a.remove();marca();
}
function importar(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.sintomas))throw 0;if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?'))return;D=Object.assign(vacio(),d);guardar();toast('Copia cargada');ir('inicio')}catch(e){toast('El archivo no es una copia válida')}};
  r.readAsText(f);
}
function borrarTodo(){if(!confirm('¿Seguro? Se borrarán todos tus registros de este navegador. Descarga antes una copia si la quieres conservar.'))return;D=vacio();guardar();toast('Datos borrados');ir('inicio')}

/* ===================== INICIO ===================== */
cargar();nav();render();
</script>
</body>
</html>
